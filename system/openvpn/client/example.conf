# OpenVPN client config template
# Copy your .ovpn file here or create a new one
# Example: /etc/openvpn/client/myvpn.conf

client
dev tun
proto udp
remote your-vpn-server.com 1194
resolv-retry infinite
nobind
persist-key
persist-tun
ca ca.crt
cert client.crt
key client.key
tls-auth ta.key 1
cipher AES-256-GCM
auth SHA256
verb 3

